<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art of Research 2026 Post Image</title>
<meta name="description" content="Make an 'I'm attending Art of Research 2026' image for LinkedIn with your own photo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="band">
  <div class="band-inner">
    <img src="assets/aor-logo.png" alt="Art of Research 2026">
    <div>
      <h1>Make your LinkedIn image</h1>
      <p>25–27 November 2026 · Aalto University</p>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <section class="panel" aria-label="Settings">
      <div class="step">
        <h2>1 · Your photo</h2>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a photo">
          <strong>Choose a photo</strong> or drop it here
        </div>
        <input type="file" id="file" accept="image/*" hidden>
        <div class="field">
          <label for="zoom">Zoom</label>
          <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
        </div>
        <p class="hint">Drag the photo in the preview to position it.</p>
      </div>

      <div class="step">
        <h2>2 · Your details</h2>
        <div class="field">
          <label for="mode">I'm…</label>
          <select id="mode">
            <option value="attending">attending</option>
            <option value="presenting">presenting</option>
            <option value="volunteering">volunteering</option>
          </select>
        </div>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name" maxlength="60" autocomplete="name">
        </div>
        <div class="field">
          <label for="org">Organisation or role (optional)</label>
          <input type="text" id="org" placeholder="e.g. Doctoral researcher, Aalto ARTS" maxlength="80">
        </div>
        <div class="field">
          <label for="msg">Your own line (optional)</label>
          <input type="text" id="msg" placeholder="e.g. See you there!" maxlength="50">
        </div>
      </div>

      <div class="step">
        <h2>3 · Size</h2>
        <div class="seg" role="group" aria-label="Image size">
          <button type="button" id="sq" aria-pressed="true">Square<br><span class="hint">1200 × 1200</span></button>
          <button type="button" id="ls" aria-pressed="false">Landscape<br><span class="hint">1200 × 627</span></button>
        </div>
      </div>

      <div class="step">
        <h2>4 · Post text</h2>
        <textarea id="post" aria-label="Post text"></textarea>
        <button type="button" id="copy">Copy text</button>
      </div>
    </section>

    <section class="preview" aria-label="Preview">
      <div class="canvas-box"><canvas id="cv" width="1200" height="1200" aria-label="Preview of your LinkedIn image"></canvas></div>
      <button type="button" class="primary" id="save">Download image</button>
      <p class="status" id="status" role="status"></p>
      <div id="fallback" hidden>
        <p class="hint">If the download didn't start, press and hold, or right-click, the image below and save it.</p>
        <img id="fallbackImg" alt="Your LinkedIn image">
      </div>
    </section>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
